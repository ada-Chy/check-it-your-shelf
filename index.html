<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Check It YourShelf</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d64d8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1 id="app-title">Check It YourShelf</h1>
        <div class="subtitle" id="app-subtitle">Smart Household & Skincare Tracker</div>
      </div>
      <button id="lang-toggle-btn" class="lang-btn">繁體中文</button>
    </header>

    <nav class="main-nav-bar">
      <button class="nav-tab active" data-tab="dashboard" id="tab-dash">Dashboard</button>
      <button class="nav-tab" data-tab="items" id="tab-items">Inventory</button>
      <button class="nav-tab" data-tab="add" id="tab-add">+ Add</button>
      <button class="nav-tab" data-tab="catalog" id="tab-catalog">Categories</button>
      <button class="nav-tab" data-tab="locations" id="tab-locations">Locations</button>
      <button class="nav-tab" data-tab="shopping" id="tab-shop">Shopping</button>
      <button class="nav-tab" data-tab="settings" id="tab-set">Settings</button>
    </nav>

    <main id="main-content">
      <!-- Views dynamically injected here -->
    </main>
  </div>

  <div id="toast" class="toast" style="display: none;"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
