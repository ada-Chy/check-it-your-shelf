<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Check It YourShelf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    
    <!-- App Header -->
    <header>
      <div>
        <h1>Check It YourShelf</h1>
        <div class="subtitle">Smart Household & Skincare Tracker</div>
      </div>
      <button class="lang-btn" onclick="toggleLanguage()">繁體中文</button>
    </header>

    <!-- Navigation Bar -->
    <nav class="main-nav-bar">
      <button class="nav-tab active" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="nav-tab" onclick="switchTab('inventory')">Inventory</button>
      <button class="nav-tab" onclick="switchTab('add')">+ Add</button>
      <button class="nav-tab" onclick="switchTab('categories')">Categories</button>
      <button class="nav-tab" onclick="switchTab('locations')">Locations</button>
      <button class="nav-tab" onclick="switchTab('shopping')">Shopping</button>
      <button class="nav-tab" onclick="switchTab('settings')">Settings</button>
    </nav>

    <!-- Datalists for Auto-Prediction -->
    <datalist id="prod-name-list"></datalist>
    <datalist id="prod-brand-list"></datalist>
    <datalist id="prod-size-list"></datalist>

    <!-- TAB 1: DASHBOARD -->
    <section id="tab-dashboard" class="tab-content">
      <div class="dashboard-grid">
        <div class="dash-card" onclick="switchTab('inventory')">
          <div class="dash-num" id="dash-total">0</div>
          <div class="dash-label">Total Items</div>
        </div>
        <div class="dash-card dash-warning" onclick="switchTab('inventory')">
          <div class="dash-num" id="dash-low">0</div>
          <div class="dash-label">Low Stock (&le;1)</div>
        </div>
        <div class="dash-card dash-warning" onclick="switchTab('inventory')">
          <div class="dash-num" id="dash-expiring">0</div>
          <div class="dash-label">Expiring Soon</div>
        </div>
        <div class="dash-card dash-danger" onclick="switchTab('inventory')">
          <div class="dash-num" id="dash-expired">0</div>
          <div class="dash-label">Expired</div>
        </div>
      </div>
    </section>

    <!-- TAB 2: INVENTORY LIST -->
    <section id="tab-inventory" class="tab-content" style="display: none;">
      <div class="card-section">
        <div class="search-filter-bar">
          <input type="text" id="search-input" placeholder="Search product or brand..." oninput="renderInventory()">
        </div>
        <div class="tabs">
          <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
          <button class="tab-btn" onclick="setFilter('In Stock', this)">In Stock</button>
          <button class="tab-btn" onclick="setFilter('In Use', this)">In Use</button>
          <button class="tab-btn" onclick="setFilter('Finished', this)">Finished</button>
        </div>
        <div id="inventory-list"></div>
      </div>
    </section>

    <!-- TAB 3: ADD NEW PRODUCT FORM -->
    <section id="tab-add" class="tab-content" style="display: none;">
      <div class="card-section">
        <h2 id="form-title">Add New Product</h2>
        <form id="product-form" class="form-grid" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="prod-id">

          <div class="input-group">
            <label for="prod-name">Product Name *</label>
            <input type="text" id="prod-name" list="prod-name-list" placeholder="e.g. Advanced Night Repair" required autocomplete="off">
          </div>

          <div class="input-group">
            <label for="prod-brand">Brand / Maker</label>
            <input type="text" id="prod-brand" list="prod-brand-list" placeholder="e.g. Estée Lauder" autocomplete="off">
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="prod-cat">Category *</label>
              <select id="prod-cat" required onchange="handleCategoryChange(this)"></select>
            </div>
            <div class="input-group">
              <label for="prod-subcat">Sub-Category</label>
              <select id="prod-subcat" onchange="handleSubCategoryChange(this)"></select>
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="prod-room">Main Room *</label>
              <select id="prod-room" required onchange="handleRoomChange(this)"></select>
            </div>
            <div class="input-group">
              <label for="prod-spot">Storage Spot</label>
              <select id="prod-spot" onchange="handleSpotChange(this)"></select>
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="prod-size">Size / Volume</label>
              <input type="text" id="prod-size" list="prod-size-list" placeholder="e.g. 50ml / 200g" autocomplete="off">
            </div>
            <div class="input-group">
              <label for="prod-price">Purchase Price ($)</label>
              <input type="number" id="prod-price" step="0.01" placeholder="0.00">
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="prod-qty">Quantity</label>
              <input type="number" id="prod-qty" value="1" min="0">
            </div>
            <div class="input-group">
              <label for="prod-status">Status</label>
              <select id="prod-status">
                <option value="In Stock">In Stock</option>
                <option value="In Use">In Use</option>
                <option value="Finished">Finished</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="prod-opened">Date Opened</label>
              <input type="date" id="prod-opened">
            </div>
            <div class="input-group">
              <label for="prod-pao">Period After Opening (Months)</label>
              <input type="number" id="prod-pao" placeholder="e.g. 6 or 12">
            </div>
          </div>

          <div class="input-group">
            <label for="prod-exp">Expiration Date</label>
            <input type="date" id="prod-exp">
          </div>

          <div class="input-group">
            <label for="prod-repurch">Worth Repurchasing?</label>
            <select id="prod-repurch">
              <option value="">-- Select --</option>
              <option value="Yes">Yes</option>
              <option value="Maybe">Maybe</option>
              <option value="No">No</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary" id="save-btn">Save Product</button>
            <button type="button" class="btn-secondary" onclick="resetForm()">Cancel</button>
          </div>
        </form>
      </div>
    </section>

    <!-- TAB 4: CATEGORY MANAGER -->
    <section id="tab-categories" class="tab-content" style="display: none;">
      <div class="card-section">
        <h2>Category Manager</h2>
        <button class="btn-primary" style="width: 100%; margin-bottom: 14px;" onclick="promptAddCategory()">+ Add Category</button>
        <div id="category-manager-list"></div>
      </div>
    </section>

    <!-- TAB 5: LOCATION MANAGER -->
    <section id="tab-locations" class="tab-content" style="display: none;">
      <div class="card-section">
        <h2>Location Manager</h2>
        <button class="btn-primary" style="width: 100%; margin-bottom: 14px;" onclick="promptAddRoom()">+ Add Room</button>
        <div id="location-manager-list"></div>
      </div>
    </section>

    <!-- TAB 6: SHOPPING LIST -->
    <section id="tab-shopping" class="tab-content" style="display: none;">
      <div class="card-section">
        <h2>Shopping / Reorder List</h2>
        <div id="shopping-list"></div>
      </div>
    </section>

    <!-- TAB 7: SETTINGS -->
    <section id="tab-settings" class="tab-content" style="display: none;">
      <div class="card-section">
        <h2>Settings</h2>
        <div class="form-grid">
          <button class="btn-secondary" onclick="exportData()">Export Data (JSON)</button>
          <button class="btn-secondary" onclick="document.getElementById('import-file').click()">Import Data (JSON)</button>
          <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
          <button class="btn-secondary" style="background: #fee2e2; color: #ef4444; border-color: #fca5a5;" onclick="clearAllData()">Reset All Data</button>
        </div>
      </div>
    </section>

  </div>

  <div id="toast" class="toast" style="display: none;"></div>
  
  <script type="module" src="app.js"></script>
</body>
</html>
