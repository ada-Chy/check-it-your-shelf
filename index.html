<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Check It YourShelf</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app">
    
    <!-- Header -->
    <header>
      <div>
        <h1>Check It YourShelf</h1>
        <div class="subtitle">Personal Inventory Tracker</div>
      </div>
    </header>

    <!-- Scrollable Tab Bar -->
    <nav class="main-nav-bar">
      <button class="nav-tab active" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="nav-tab" onclick="switchTab('inventory')">Inventory</button>
      <button class="nav-tab" onclick="switchTab('add')">Add Item</button>
      <button class="nav-tab" onclick="switchTab('categories')">Categories</button>
      <button class="nav-tab" onclick="switchTab('locations')">Locations</button>
      <button class="nav-tab" onclick="switchTab('shopping')">Shopping</button>
      <button class="nav-tab" onclick="switchTab('settings')">Settings</button>
    </nav>

    <!-- Tab 1: Dashboard -->
    <section id="tab-dashboard" class="tab-content">
      <div class="dashboard-grid">
        <div class="dash-card" onclick="switchTab('inventory')">
          <div id="dash-total" class="dash-num">0</div>
          <div class="dash-label">Total Products</div>
        </div>
        <div class="dash-card dash-warning" onclick="switchTab('inventory')">
          <div id="dash-low" class="dash-num">0</div>
          <div class="dash-label">Low Stock</div>
        </div>
        <div class="dash-card dash-warning" onclick="switchTab('inventory')">
          <div id="dash-expiring" class="dash-num">0</div>
          <div class="dash-label">Expiring Soon</div>
        </div>
        <div class="dash-card dash-danger" onclick="switchTab('inventory')">
          <div id="dash-expired" class="dash-num">0</div>
          <div class="dash-label">Expired</div>
        </div>
      </div>
    </section>

    <!-- Tab 2: Inventory -->
    <section id="tab-inventory" class="tab-content" style="display: none;">
      <div class="search-filter-bar">
        <input type="text" id="search-input" placeholder="Search by name or brand..." oninput="renderInventory()" />
      </div>
      
      <div class="tabs">
        <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
        <button class="tab-btn" onclick="setFilter('In Stock', this)">In Stock</button>
        <button class="tab-btn" onclick="setFilter('Opened', this)">Opened</button>
        <button class="tab-btn" onclick="setFilter('Finished', this)">Finished</button>
      </div>

      <div id="inventory-list"></div>
    </section>

    <!-- Tab 3: Add / Edit Form -->
    <section id="tab-add" class="tab-content" style="display: none;">
      <div class="card-section">
        <h2 id="form-title">Add New Product</h2>
        <form id="product-form" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="prod-id" />

          <div class="form-grid">
            <div class="input-group">
              <label for="prod-name">Product Name *</label>
              <input type="text" id="prod-name" list="prod-name-list" required placeholder="e.g. Cleansing Foam" />
              <datalist id="prod-name-list"></datalist>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="prod-brand">Brand</label>
                <input type="text" id="prod-brand" list="prod-brand-list" placeholder="e.g. CeraVe" />
                <datalist id="prod-brand-list"></datalist>
              </div>
              <div class="input-group">
                <label for="prod-size">Size / Volume</label>
                <input type="text" id="prod-size" list="prod-size-list" placeholder="e.g. 200ml" />
                <datalist id="prod-size-list"></datalist>
              </div>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="prod-cat">Category</label>
                <select id="prod-cat" onchange="handleCategoryChange(this)"></select>
              </div>
              <div class="input-group">
                <label for="prod-subcat">Sub-Category</label>
                <select id="prod-subcat" onchange="handleSubCategoryChange(this)"></select>
              </div>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="prod-room">Main Room</label>
                <select id="prod-room" onchange="handleRoomChange(this)"></select>
              </div>
              <div class="input-group">
                <label for="prod-spot">Storage Spot</label>
                <select id="prod-spot" onchange="handleSpotChange(this)"></select>
              </div>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="prod-price">Price ($)</label>
                <input type="number" id="prod-price" step="0.01" placeholder="0.00" />
              </div>
              <div class="input-group">
                <label for="prod-qty">Quantity</label>
                <input type="number" id="prod-qty" value="1" min="0" required />
              </div>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="prod-status">Status</label>
                <select id="prod-status">
                  <option value="In Stock">In Stock</option>
                  <option value="Opened">Opened</option>
                  <option value="Finished">Finished</option>
                </select>
              </div>
              <div class="input-group">
                <label for="prod-repurch">Repurchase?</label>
                <select id="prod-repurch">
                  <option value="No">No</option>
                  <option value="Yes">Yes</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="prod-opened">Date Opened</label>
                <input type="date" id="prod-opened" />
              </div>
              <div class="input-group">
                <label for="prod-pao">PAO (Period After Opening)</label>
                <input type="text" id="prod-pao" placeholder="e.g. 12M" />
              </div>
            </div>

            <div class="input-group">
              <label for="prod-exp">Expiration Date</label>
              <input type="date" id="prod-exp" />
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-primary" id="save-btn">Save Product</button>
              <button type="button" class="btn-secondary" onclick="resetForm()">Reset</button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <!-- Tab 4: Category Manager -->
    <section id="tab-categories" class="tab-content" style="display: none;">
      <div class="card-section">
        <h2>Category Manager</h2>
        <button class="btn-primary" style="margin-bottom: 12px; width: 100%;" onclick="promptAddCategory()">+ Add New Category</button>
        <div id="category-manager-list"></div>
      </div>
    </section>

    <!-- Tab 5: Location Manager -->
    <section id="tab-locations" class="tab-content" style="display: none;">
      <div class="card-section">
        <h2>Location Manager</h2>
        <button class="btn-primary" style="margin-bottom: 12px; width: 100%;" onclick="promptAddRoom()">+ Add New Room</button>
        <div id="location-manager-list"></div>
      </div>
    </section>

    <!-- Tab 6: Shopping List -->
    <section id="tab-shopping" class="tab-content" style="display: none;">
      <div class="card-section">
        <h2>Shopping List</h2>
        <div id="shopping-list"></div>
      </div>
    </section>

    <!-- Tab 7: Settings & Data Portability -->
    <section id="tab-settings" class="tab-content" style="display: none;">
      <div class="card-section">
        <h2>Data Management</h2>
        <div class="form-grid">
          <button class="btn-secondary" onclick="exportData()">Export Backup (JSON)</button>
          
          <label class="btn-secondary" style="text-align: center; line-height: 46px; cursor: pointer;">
            Import Data
            <input type="file" accept=".json" onchange="importData(event)" style="display: none;" />
          </label>
          
          <button class="btn-secondary" style="color: #ef4444; border-color: #fee2e2; background: #fff5f5;" onclick="clearAllData()">Reset All Data</button>
        </div>
      </div>
    </section>

    <!-- Toast Notification Container -->
    <div id="toast" class="toast" style="display: none;"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
