<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Mobile Viewport & PWA Settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Check It YourShelf">

  <!-- iPhone Home Screen App Icon -->
  <link rel="apple-touch-icon" href="icon.png">

  <title>Check It YourShelf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Check It YourShelf</h1>
      <p class="subtitle">Track household consumables & skincare by product and batch</p>
      <button type="button" id="notify-toggle-btn" class="btn-sm" onclick="toggleNotificationPermission()" style="margin-top: 10px;">
        🔔 Enable Notifications
      </button>
    </header>

    <main>
      <!-- Add / Edit Item Form -->
      <section class="card-section">
        <h2 id="form-heading">Add Product Batch / 新增產品批號</h2>
        <form id="item-form" autocomplete="off">
          
          <!-- Product Master Info -->
          <div class="form-row">
            <div class="input-group">
              <label for="name">Product Name / 產品名稱 *</label>
              <input type="text" id="name" list="product-suggestions" placeholder="Type or select item..." required>
              <datalist id="product-suggestions"></datalist>
            </div>
            <div class="input-group">
              <label for="brand">Brand / 品牌</label>
              <input type="text" id="brand" placeholder="e.g. CeraVe, Tide">
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="category">Category / 主分類 *</label>
              <select id="category" required onchange="onCategoryChange()">
                <option value="">-- Select Category --</option>
              </select>
            </div>
            <div class="input-group">
              <label for="sub-category">Sub-category / 子分類</label>
              <select id="sub-category" onchange="onSubCategoryChange()">
                <option value="">-- Select Sub-category --</option>
              </select>
            </div>
          </div>

          <!-- Dynamic Custom Input Row -->
          <div class="form-row" style="margin-bottom: 8px;">
            <input type="text" id="custom-category" placeholder="Or type a new main category..." style="display: none;">
            <input type="text" id="custom-sub-category" placeholder="Or type a new sub-category..." style="display: none;">
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="low-threshold">Low Stock Alert Below / 補貨警戒數量</label>
              <input type="number" id="low-threshold" value="1" min="0">
            </div>
          </div>

          <!-- Batch Specific Details -->
          <fieldset class="form-fieldset">
            <legend>Batch Specific Details / 批號個別資訊</legend>
            
            <div class="form-row">
              <div class="input-group">
                <label for="batch-code">Batch / Lot Code / 批號</label>
                <input type="text" id="batch-code" placeholder="e.g. 21T400">
              </div>
              <div class="input-group">
                <label for="quantity">Quantity / 數量</label>
                <input type="number" id="quantity" value="1" min="0">
              </div>
              <div class="input-group">
                <label for="status">Status / 狀態</label>
                <select id="status">
                  <option value="In Stock">In Stock / 有存貨</option>
                  <option value="Using">Using / 使用中</option>
                  <option value="Finished">Finished / 已用完</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="purchase-date">Purchase Date / 購買日期</label>
                <input type="date" id="purchase-date">
              </div>
              <div class="input-group">
                <label for="opened-date">Opened Date / 開封日</label>
                <input type="date" id="opened-date">
              </div>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="expiry-date">Expiry Date / 到期日</label>
                <input type="date" id="expiry-date">
              </div>
              <div class="input-group">
                <label for="pao">PAO (Months / 月) 🧴</label>
                <input type="number" id="pao" placeholder="e.g. 6, 12, 24" min="0">
              </div>
            </div>

            <div class="input-group">
              <label for="location">Storage Location / 存放位置</label>
              <input type="text" id="location" placeholder="e.g. Bathroom Cabinet, Pantry Shelf 2">
            </div>
          </fieldset>

          <!-- Evaluation -->
          <div class="form-row">
            <div class="input-group">
              <label for="worth">Repurchase Rating / 值得再買嗎？</label>
              <select id="worth">
                <option value="">-- Select --</option>
                <option value="Yes">Yes / 值得</option>
                <option value="No">No / 不值得</option>
                <option value="Maybe">Maybe / 再看看</option>
              </select>
            </div>
            <div class="input-group">
              <label for="worth-remark">Notes / Remarks / 備註</label>
              <input type="text" id="worth-remark" placeholder="e.g. Texture is heavy, bought on sale">
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn-primary">Add Batch / 新增批號</button>
            <button type="button" id="cancel-btn" class="btn-secondary" style="display:none;" onclick="resetForm()">Cancel / 取消</button>
          </div>
        </form>
      </section>

      <!-- Manage Categories -->
      <section class="card-section">
        <h2>Manage Categories / 管理分類</h2>
        <div id="categories-list"></div>
      </section>

      <!-- Inventory View -->
      <section class="card-section">
        <div class="list-header">
          <h2>Inventory Catalog / 物品清單</h2>
          <div class="data-actions">
            <button type="button" class="btn-sm" onclick="exportData()">Export JSON</button>
            <button type="button" class="btn-sm" onclick="document.getElementById('import-file').click()">Import JSON</button>
            <input type="file" id="import-file" style="display:none;" onchange="importData(event)" accept=".json">
          </div>
        </div>

        <div class="search-filter-bar">
          <input type="text" id="search-input" placeholder="Search product, brand, batch, notes, location..." onkeyup="renderItems()" oninput="renderItems()">
          <select id="filter-category" onchange="onFilterCategoryChange()">
            <option value="ALL">All Categories</option>
          </select>
          <select id="filter-sub-category" onchange="renderItems()">
            <option value="ALL">All Sub-categories</option>
          </select>
        </div>

        <div class="tabs">
          <button type="button" class="tab-btn active" onclick="setTab('ALL', this)">All Products</button>
          <button type="button" class="tab-btn" onclick="setTab('LOW_STOCK', this)">⚠️ Low Stock</button>
          <button type="button" class="tab-btn" onclick="setTab('EXPIRING', this)">⌛ Expiring Soon</button>
          <button type="button" class="tab-btn" onclick="setTab('FINISHED', this)">Finished Batches</button>
        </div>

        <div id="items-list">
          <!-- Multi-batch grouped cards render here -->
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
